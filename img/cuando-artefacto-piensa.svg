<?xml version="1.0" encoding="UTF-8"?>
<svg width="2752" height="1536" xmlns="http://www.w3.org/2000/svg">
  <!-- Split background -->
  <rect width="1376" height="1536" fill="#faf8f6"/>
  <rect x="1376" width="1376" height="1536" fill="#221d18"/>

  <!-- Left side: Museum interface mockup -->
  <rect x="120" y="180" width="1100" height="700" fill="#faf8f6" stroke="#c16f52" stroke-width="3"/>
  <text x="160" y="280" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#1a1512">Museo del Prado</text>
  <text x="160" y="340" font-family="Arial, sans-serif" font-size="32" fill="#1a1512">Entrada adaptativa</text>

  <!-- Price -->
  <text x="160" y="520" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#c16f52">€18</text>
  <text x="360" y="500" font-family="Arial, sans-serif" font-size="28" fill="#1a1512">+ 10% ajuste climático</text>

  <!-- Conditions -->
  <text x="160" y="600" font-family="Arial, sans-serif" font-size="24" fill="rgba(26,21,18,0.6)">Temperatura: 42°C</text>
  <text x="160" y="650" font-family="Arial, sans-serif" font-size="24" fill="rgba(26,21,18,0.6)">Humedad: 28%</text>
  <text x="160" y="700" font-family="Arial, sans-serif" font-size="24" fill="rgba(26,21,18,0.6)">Ocupación: 73%</text>

  <!-- Tag -->
  <rect x="140" y="950" width="300" height="80" fill="rgba(193,111,82,0.9)"/>
  <text x="160" y="1000" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#faf8f6">MADRID 2030</text>

  <!-- Right side: Educational grid -->
  <rect x="1476" y="180" width="280" height="200" fill="#c16f52"/>
  <text x="1496" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#faf8f6">Escenario</text>

  <rect x="1796" y="180" width="280" height="200" fill="#c16f52"/>
  <text x="1816" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#faf8f6">Drivers</text>

  <rect x="1476" y="420" width="280" height="200" fill="#faf8f6"/>
  <text x="1496" y="460" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a1512">Artefacto</text>

  <rect x="1796" y="420" width="280" height="200" fill="#faf8f6"/>
  <text x="1816" y="460" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a1512">Fricción</text>

  <!-- Principles -->
  <text x="1476" y="1100" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="rgba(250,248,246,0.9)">El artefacto piensa</text>
  <text x="1476" y="1160" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="rgba(250,248,246,0.9)">El ecosistema valida</text>
  <text x="1476" y="1220" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="rgba(250,248,246,0.9)">La fricción es el material</text>

  <!-- Divider -->
  <line x1="1376" y1="100" x2="1376" y2="1436" stroke="rgba(193,111,82,0.3)" stroke-width="2"/>

  <!-- BPP logo -->
  <text x="2572" y="1456" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#c16f52">BPP</text>
</svg>