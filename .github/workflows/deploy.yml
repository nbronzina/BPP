name: Deploy to GitHub Pages

on:
  push:
    # El repo no tiene main: la rama por defecto es la que publica.
    branches:
      - main
      - claude/bpp-analytics-website-01Qg8KmqzsnS33vifronWpqF
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Eleventy genera _site/ solo a partir de src/ y los assets declarados en .eleventy.js.
      # Nada de la raíz (CLAUDE.md, DESIGN.md, VOICE.md, docs/, auditorías) entra al artefacto.
      - name: Build and check
        run: npm run check

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
