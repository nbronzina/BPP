name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No publicar documentación interna ni archivos de trabajo
      - name: Remove internal files from artifact
        run: |
          rm -rf .claude .github
          rm -f CLAUDE.md DESIGN.md VOICE.md README.md
          rm -f BENCHMARKING-REPORT-*.md CAMBIOS_IMPLEMENTADOS.md OPTIMIZATION-REPORT.md
          rm -f AUDITORIA-*.md audit-*.md audit-*.txt
          rm -f _prototype-*.html build.sh
          rm -rf img/archive img/backup

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
