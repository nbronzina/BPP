<!DOCTYPE html>
<html lang="es" style="color-scheme: dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Gracias por contactarnos. Te respondemos en menos de 24 horas.">
    <meta name="author" content="BPP Analytics &amp; Design">
    <meta name="robots" content="noindex, nofollow">
    <title>Gracias por contactarnos | BPP Analytics &amp; Design</title>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.bppanalyticsanddesign.com/gracias">

    <!-- Favicons -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <!-- Theme -->
    <link rel="manifest" href="site.webmanifest?v=73">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Preconnect to External Services -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://plausible.io">

    <!-- Google Fonts (Async) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Lexend+Deca:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Lexend+Deca:wght@400;600;700&display=swap"></noscript>

    <!-- Critical CSS Inline -->
    <style>
@font-face{font-family:'ZT Bros Oskon Fallback';src:local('Arial');size-adjust:106.5%;ascent-override:89.8%;descent-override:22.2%;line-gap-override:0%}:root{--color-bg:#1a1512;--color-text:#faf8f6;--color-text-light:rgba(250,248,246,0.87);--color-accent:#c16f52;--color-accent-hover:#d98f6e;--border-radius:8px}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:'ZT Bros Oskon','ZT Bros Oskon Fallback',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background-color:var(--color-bg);color:var(--color-text-light);line-height:1.7;overflow-x:hidden;animation:fadeIn 0.6s ease-in}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.thank-you-container{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem;text-align:center}.thank-you-logo{margin-bottom:2rem;opacity:0.9}.thank-you-logo img{height:120px;width:auto}.thank-you-heading{font-size:clamp(2rem,5vw,3rem);font-weight:700;margin-bottom:1rem;color:var(--color-text)}.thank-you-timeline{max-width:600px;margin:3rem auto;text-align:left}.timeline-heading{font-size:1.5rem;font-weight:700;margin-bottom:2rem;color:var(--color-text);text-align:center}.timeline-item{display:flex;gap:1.5rem;margin-bottom:2rem;align-items:flex-start}.timeline-marker{width:32px;height:32px;border-radius:50%;border:2px solid var(--color-accent);background:var(--color-bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}.timeline-marker::after{content:'';position:absolute;top:32px;left:50%;transform:translateX(-50%);width:2px;height:2rem;background:rgba(212,117,69,0.3)}.timeline-item:last-child .timeline-marker::after{display:none}.timeline-marker--active{background:var(--color-accent)}.timeline-marker--active::before{content:'●';color:#0f0f0f;font-size:1rem}.timeline-content h3{font-size:1.125rem;font-weight:600;color:var(--color-text);margin-bottom:0.25rem}.timeline-content p{font-size:0.95rem;color:var(--color-text-light);opacity:0.8}.cta-primary{display:inline-block;padding:0.875rem 1.75rem;background:var(--color-accent);color:#1a1512;text-decoration:none;font-family:'ZT Bros Oskon',ui-monospace,monospace;font-size:0.875rem;font-weight:700;transition:opacity 0.2s ease;margin-top:2rem}.cta-primary:hover{opacity:0.88}
    </style>

    <!-- Full Styles (Async) -->
    <link rel="preload" href="styles.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="styles.min.css"></noscript>

    <!-- Analytics - Plausible -->
    <script defer data-domain="bppanalyticsanddesign.com" src="https://plausible.io/js/plausible.js"></script>
</head>

<body class="gracias-page">
    <!-- Main Content -->
    <main role="main" class="thank-you-container">
        <!-- Logo -->
        <div class="thank-you-logo">
            <a href="/" aria-label="Volver al inicio">
                <picture>
                    <source srcset="img/logo-160.webp 160w, img/logo-320.webp 320w" type="image/webp" sizes="120px">
                    <img src="img/logo-160.png" alt="BPP Analytics & Design logo" width="160" height="160" loading="eager" decoding="async">
                </picture>
            </a>
        </div>

        <!-- Mensaje principal -->
        <h1 class="thank-you-heading">Recibimos tu mensaje.</h1>
        <p style="font-size: 1.125rem; color: var(--color-text-light); margin-bottom: 1rem;">
            Gracias por contactarnos. Revisamos tu consulta y te respondemos a la brevedad.
        </p>

        <!-- Timeline -->
        <div class="thank-you-timeline">
            <h2 class="timeline-heading">¿Qué pasa ahora?</h2>

            <div class="timeline-item">
                <div class="timeline-marker timeline-marker--active"></div>
                <div class="timeline-content">
                    <h3>Hoy</h3>
                    <p>Recibimos tu mensaje</p>
                </div>
            </div>

            <div class="timeline-item">
                <div class="timeline-marker"></div>
                <div class="timeline-content">
                    <h3>24 horas</h3>
                    <p>Confirmamos recepción por email</p>
                </div>
            </div>

            <div class="timeline-item">
                <div class="timeline-marker"></div>
                <div class="timeline-content">
                    <h3>48 horas</h3>
                    <p>Primera propuesta o diagnóstico</p>
                </div>
            </div>

            <div class="timeline-item">
                <div class="timeline-marker"></div>
                <div class="timeline-content">
                    <h3>7 días</h3>
                    <p>Llamada si hay match</p>
                </div>
            </div>
        </div>

        <!-- CTA -->
        <a href="/" class="cta-primary" aria-label="Volver al inicio">
            <span class="cta-arrow cta-arrow--left" aria-hidden="true">←</span> Volver al sitio
        </a>
    </main>

    <!-- JavaScript -->
    <script src="main.min.js" defer></script>

    <!-- Track page view -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (window.plausible && typeof window.plausible === 'function') {
            window.plausible('Thank_you_page_viewed');
        }
    });
    </script>
</body>
</html>
