<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0a0a">
    <title>Sin Conexión - BPP Analytics & Design</title>

    <!-- SEO: Prevenir indexación de página offline -->
    <meta name="robots" content="noindex, nofollow">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .offline-container {
            text-align: center;
            max-width: 500px;
        }

        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: rgba(217, 143, 110, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .offline-icon svg {
            width: 60px;
            height: 60px;
            fill: #D98F6E;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #D98F6E;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #c5c5c5;
            margin-bottom: 2rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid #D98F6E;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: #D98F6E;
            color: #0a0a0a;
        }

        .btn-primary:hover {
            background: #E8A67D;
            border-color: #E8A67D;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: transparent;
            color: #D98F6E;
        }

        .btn-secondary:hover {
            background: rgba(217, 143, 110, 0.1);
            transform: scale(1.02);
        }

        button:focus-visible {
            outline: 2px solid #D98F6E;
            outline-offset: 3px;
        }

        .info-text {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #b0b0b0;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            button:hover {
                transform: none;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" opacity="0.3"/>
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
                <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3z"/>
            </svg>
        </div>

        <h1>Sin Conexión</h1>
        <p>
            Parece que perdiste la conexión a internet.
            Esta página estaba guardada y está disponible offline,
            pero otras funciones requieren conexión.
        </p>

        <div class="button-group">
            <button class="btn-primary" id="retryBtn">
                Reintentar
            </button>
            <button class="btn-secondary" id="homeBtn">
                Ir al Inicio
            </button>
        </div>

        <p class="info-text">
            La aplicación se sincronizará automáticamente cuando
            recuperes la conexión.
        </p>
    </div>

    <script>
        // Button event listeners
        document.getElementById('retryBtn')?.addEventListener('click', () => {
            location.reload();
        });

        document.getElementById('homeBtn')?.addEventListener('click', () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/';
            }
        });

        // Auto-retry when online
        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>
</html>
